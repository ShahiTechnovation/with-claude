name: Preview smoke

# Vercel sends a repository_dispatch event when a deployment succeeds. For each
# preview of the public site, open its core pages in a real browser and fail
# on what a visitor would hit.
#
# GitHub reads a repository_dispatch workflow from the default branch only, so
# no pull request can change what runs here. A deployment_status workflow is
# read from the deployed commit instead: on a fork's preview, the fork's copy.
on:
  repository_dispatch:
    types: ['vercel.deployment.success']

permissions:
  contents: read

jobs:
  # Runs for every successful deployment and holds no secret. The smoke job
  # below is filtered on two strings, and a wrong one skips it without a trace:
  # this prints what Vercel actually sent, so a mismatch shows in the log.
  payload:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Show what Vercel sent
        env:
          ENVIRONMENT: ${{ github.event.client_payload.environment }}
          PROJECT: ${{ github.event.client_payload.project.name }}
          DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
        run: |
          host="${DEPLOYMENT_URL#*://}"
          echo "environment:  $ENVIRONMENT"
          echo "project.name: $PROJECT"
          echo "url host:     ${host%%/*}"

  smoke:
    # Two Vercel projects share this repository: only the public site's previews.
    # (Field names: github.com/vercel/repository-dispatch,
    # packages/repository-dispatch/src/data/common.ts; `url` is in
    # data/deployment.ts beside it.)
    if: >-
      github.event.client_payload.project.name == 'with-claude' &&
      github.event.client_payload.environment == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Review the preview
        env:
          BASE: ${{ github.event.client_payload.url }}
          # Both go to the preview's origin only, never along a redirect. The
          # cookie Vercel answers the second with is for the preview's host
          # alone, and it carries redirects within the preview. With the secret
          # unset both values are empty and the script sends neither header; a
          # protected preview then fails as "ended on".
          EXTRA_HEADERS: |-
            x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
            x-vercel-set-bypass-cookie: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' && 'true' || '' }}
          PAGES: /,/events/,/cities/,/projects/,/about/
          OUT: shots/preview
          STRICT: '1'
        run: node scripts/dev/visual-review.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-screenshots
          path: shots/preview
          retention-days: 14
